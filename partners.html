<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>店舗様専用ログイン | SHADOW SPEED STICK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--speed:#f5d300;--smoke:#f4f4f1;--line:#e5e5e0;--muted:#5c5c58}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",sans-serif;font-weight:600;color:var(--ink);background:var(--smoke);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:18px 20px}
header .logo{font-family:"Oswald",sans-serif;font-size:20px;letter-spacing:.06em}
header .logo span{color:var(--speed)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.box{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:32px 28px;max-width:420px;width:100%}
.box h1{font-size:22px;font-weight:900;margin-bottom:6px}
.box p.lead{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:22px}
label{display:block;font-size:13px;font-weight:900;margin:16px 0 6px}
input{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;font-family:inherit;font-weight:600}
input:focus{outline:2px solid var(--speed);border-color:var(--ink)}
button{width:100%;margin-top:24px;background:var(--speed);color:var(--ink);border:none;font-size:17px;font-weight:900;padding:15px;border-radius:6px;cursor:pointer;font-family:inherit}
button:hover{background:var(--ink);color:var(--speed)}
.err{display:none;background:#fdecec;border:1px solid #e5a3a3;color:#a11;border-radius:6px;padding:10px 12px;font-size:13.5px;margin-top:16px;line-height:1.6}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:20px}
footer{background:var(--ink);color:#999;padding:22px 20px;font-size:12px;text-align:center}
footer a{color:#ccc}
</style>
</head>
<body>
<header><div class="logo">SHADOW <span>SPEED STICK</span></div></header>
<main>
<div class="box">
<h1>店舗様専用ログイン</h1>
<p class="lead">SHADOW SPEED STICK の卸注文ページへのログインです。お渡しした店舗様専用のIDとパスワードを入力してください。</p>
<form id="loginForm">
<label for="sid">店舗ID</label>
<input type="text" id="sid" autocomplete="username" required>
<label for="spw">パスワード</label>
<input type="password" id="spw" autocomplete="current-password" required>
<button type="submit">ログインする</button>
<div class="err" id="err">IDまたはパスワードが違います。ご確認のうえ、もう一度入力してください。</div>
</form>
<p class="note">ID・パスワードをまだお持ちでない店舗様は、合同会社 ONE FOR DREAM（onefordream72@gmail.com）までお問い合わせください。</p>
</div>
</main>
<footer><a href="index.html">SHADOW SPEED STICK 販売ページへ戻る</a><br>&copy; 2026 SHADOW SPEED STICK / 合同会社 ONE FOR DREAM</footer>
<script>
var ACCOUNTS = {
  "test": { hash: "b9eff0fd7b588901a35d797ff73b4dee696b5b2c2fc8fa52a03f25c16a205b21", name: "テスト店舗様" }
};
async function sha256(text){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var id = document.getElementById('sid').value.trim();
  var pw = document.getElementById('spw').value;
  var acc = ACCOUNTS[id];
  var h = await sha256(id + ':' + pw);
  if (acc && acc.hash === h) {
    sessionStorage.setItem('sss_shop', acc.name);
    location.href = 'wholesale-4d8f.html';
  } else {
    document.getElementById('err').style.display = 'block';
  }
});
</script>
</body>
</html>
